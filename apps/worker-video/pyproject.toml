[project]
name = "casebook-video"
version = "0.0.0"
description = "Worker de vídeo do Casebook (BullMQ + PyAV)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "bullmq==3.2.6",
  "av==18.1.0",
  "numpy==2.5.3",
  "scikit-image==0.26.0",
  "boto3==1.43.100",
  "asyncpg==0.31.0",
  "pydantic-settings==2.15.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[dependency-groups]
dev = [
  "ruff==0.16.8",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
casebook-video = "casebook_video.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/casebook_video"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "N"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

# Pacotes sem tipos publicados (sem py.typed).
[[tool.mypy.overrides]]
module = ["bullmq", "bullmq.*", "skimage", "skimage.*", "boto3", "boto3.*", "asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
