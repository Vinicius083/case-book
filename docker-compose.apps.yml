# Os cinco apps a partir dos Dockerfiles de produção, sobre a infra de dev.
# Serve para validar as imagens; no dia a dia rode `pnpm dev` fora do Docker.
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.apps.yml up --build
#
# Pare o `pnpm dev` antes: web (3000) e api (3001) usam as mesmas portas no host.
# Dentro da rede `casebook`, os serviços se acham pelo nome (postgres, redis,
# ingester), não por localhost.

x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://ingester:4318

# Storage: os processos falam com o MinIO pela rede interna; as URLs presigned
# são assinadas para localhost:9000, o endereço que o browser alcança.
x-storage: &storage
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: auto
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-casebook}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-casebook-dev-secret}
  S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-casebook-originals}
  S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-casebook-media}
  S3_FORCE_PATH_STYLE: 'true'
  PUBLIC_MEDIA_URL: http://localhost:9000/casebook-media

x-redis-deps: &redis-deps
  redis:
    condition: service_healthy

services:
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    image: casebook-api:dev
    environment:
      <<: [*otel, *storage]
      NODE_ENV: production
      API_PORT: '3001'
      WEB_URL: http://localhost:3000
      DATABASE_URL: postgres://casebook:casebook@postgres:5432/casebook
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-dev-only-change-me-dev-only}
    ports: ['3001:3001']
    depends_on:
      <<: *redis-deps
      postgres:
        condition: service_healthy
    networks: [casebook]
    restart: unless-stopped

  relay:
    build: { context: ., dockerfile: apps/relay/Dockerfile }
    image: casebook-relay:dev
    environment:
      <<: [*otel, *storage]
      DATABASE_URL: postgres://casebook:casebook@postgres:5432/casebook
      REDIS_URL: redis://redis:6379
    depends_on:
      <<: *redis-deps
      postgres:
        condition: service_healthy
    networks: [casebook]
    # Tempo para terminar o lote em andamento (a transação desfaz se for cortada).
    stop_grace_period: 15s
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: casebook-web:dev
    environment:
      <<: *otel
      API_URL: http://api:3001
      PUBLIC_BASE_URL: http://localhost:3000
    ports: ['3000:3000']
    depends_on:
      api:
        condition: service_healthy
    networks: [casebook]
    restart: unless-stopped

  worker-image:
    build: { context: ., dockerfile: apps/worker-image/Dockerfile }
    image: casebook-worker-image:dev
    environment:
      <<: *otel
      REDIS_URL: redis://redis:6379
    depends_on: *redis-deps
    networks: [casebook]
    # Tempo para o worker.close() esperar o job em andamento.
    stop_grace_period: 30s
    restart: unless-stopped

  worker-video:
    build: { context: ., dockerfile: apps/worker-video/Dockerfile }
    image: casebook-worker-video:dev
    environment:
      <<: *otel
      REDIS_URL: redis://redis:6379
    depends_on: *redis-deps
    networks: [casebook]
    # Transcode pode levar minutos; em prod o grace period acompanha o lockDuration.
    stop_grace_period: 60s
    restart: unless-stopped
