name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    services:
      # Testes de integração da API rodam contra Postgres e Redis reais.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casebook
          POSTGRES_USER: casebook
          POSTGRES_PASSWORD: casebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casebook -d casebook"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # versão vem de packageManager no package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache do Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # Os valores do .env.example batem com os services acima (localhost:5432/6379).
      - run: cp .env.example .env

      - name: Migrations
        run: pnpm db:migrate

      # worker-video (Python) roda no job `python`.
      - name: Lint, typecheck, test e build
        run: >-
          pnpm turbo run lint typecheck test build
          --filter='!@casebook/worker-video'
          --cache-dir=.turbo/cache

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/worker-video
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: apps/worker-video/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    name: Docker (${{ matrix.app }})
    needs: [node, python]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker-image, worker-video]
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Tag da imagem
        id: meta
        run: |
          # GHCR exige nome em minúsculas; o owner do repositório pode não estar.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/casebook-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
