name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write # push das imagens no GHCR (job docker, só em push na main)

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  node:
    name: Node (lint, typecheck, test, build)
    runs-on: ubuntu-24.04
    services:
      # Usados só pelos testes de integração (test:integration).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: casebook
          POSTGRES_USER: casebook
          POSTGRES_PASSWORD: casebook
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U casebook -d casebook"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # versão vem de packageManager no package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache do Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # worker-video (Python) roda no job `python`; por isso o filtro em todos os passos.
      - name: Lint, typecheck e build
        run: >-
          pnpm turbo run lint typecheck build
          --filter='!@casebook/worker-video'
          --cache-dir=.turbo/cache

      - name: Testes unitários
        run: >-
          pnpm turbo run test
          --filter='!@casebook/worker-video'
          --cache-dir=.turbo/cache

      # Os valores do .env.example batem com os services acima (localhost:5432/6379).
      - run: cp .env.example .env

      - name: Migrations
        run: pnpm db:migrate

      - name: Testes de integração
        run: >-
          pnpm turbo run test:integration
          --filter='!@casebook/worker-video'
          --cache-dir=.turbo/cache

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/worker-video
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # o projeto não publica tag flutuante de major
        with:
          version: 0.11.7
          enable-cache: true
          cache-dependency-glob: apps/worker-video/uv.lock

      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

      # Mesmo binário fixado da imagem (versão e SHA256 em fetch_ffmpeg.py): o teste de
      # concordância de codecs compara o FFmpeg do wheel do PyAV com este CLI.
      - name: FFmpeg estático
        run: |
          uv run python scripts/fetch_ffmpeg.py "$RUNNER_TEMP/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg" >> "$GITHUB_PATH"

      - name: Testes unitários
        run: uv run pytest -m "not integration" -v

      - name: Testes de integração
        run: uv run pytest -m integration
        env:
          REDIS_URL: redis://localhost:6379
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318

  docker:
    name: Docker (${{ matrix.app }})
    needs: [node, python]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, worker-image, worker-video]
    env:
      # Publica só em push na main; em PR apenas valida o build.
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Tags da imagem
        id: meta
        run: |
          # GHCR exige nome em minúsculas; o owner do repositório pode não estar.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/casebook-${{ matrix.app }}"
          {
            echo "tags<<EOF"
            echo "${image}:${GITHUB_SHA::7}"
            echo "${image}:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Cache do Buildx isolado por app.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
